# Gahwit Sitti: tests on every push, phone builds every night or on demand (games/gahwit-sitti/missing/23).
#
# Secrets (repository settings > Secrets and variables > Actions). Jobs that need one skip their steps without it:
#   UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD   Unity tests and builds (GameCI: https://game.ci/docs/github/activation)
#   ANDROID_KEYSTORE_BASE64                      the upload key, base64 of the .keystore file
#   ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS
name: Gahwit Sitti

on:
  push:
    paths:
      - "games/gahwit-sitti/**"
      - "platform/**"
      - "unity-shared/**"
      - ".github/workflows/gahwit-sitti.yml"
  pull_request:
    paths:
      - "games/gahwit-sitti/**"
      - "platform/**"
      - "unity-shared/**"
  schedule:
    - cron: "0 1 * * *" # every night, 01:00 UTC
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.3.27f1
  PROJECT_PATH: games/gahwit-sitti/unity

jobs:
  platform:
    name: Platform tests (.NET)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLATFORM_TEST_DB: Host=localhost;Username=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test platform/Platform.slnx

  unity-tests:
    name: Unity tests (EditMode; PlayMode at night)
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Skip without a Unity licence
        if: env.UNITY_LICENSE == ''
        run: echo "::warning::No UNITY_LICENSE secret, so the Unity tests were skipped."
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
        with:
          lfs: true
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: library-tests-${{ hashFiles('games/gahwit-sitti/unity/Packages/packages-lock.json') }}
          restore-keys: library-tests-
      - uses: game-ci/unity-test-runner@v4
        if: env.UNITY_LICENSE != ''
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: ${{ github.event_name == 'schedule' && 'all' || 'editmode' }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

  android:
    name: Android app bundle
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Skip without a Unity licence
        if: env.UNITY_LICENSE == ''
        run: echo "::warning::No UNITY_LICENSE secret, so the Android build was skipped."
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
        with:
          lfs: true
      - name: Upload key from the secret store
        if: env.UNITY_LICENSE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
            echo "GAHWIT_ANDROID_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          fi
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: library-android-${{ hashFiles('games/gahwit-sitti/unity/Packages/packages-lock.json') }}
          restore-keys: library-android-
      - uses: game-ci/unity-builder@v4
        if: env.UNITY_LICENSE != ''
        env:
          GAHWIT_ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          GAHWIT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GAHWIT_ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: Android
          buildMethod: Gahwit.EditorTools.BuildTools.BuildAndroid
      - uses: actions/upload-artifact@v4
        if: env.UNITY_LICENSE != ''
        with:
          name: gahwit-sitti-android-${{ github.run_number }}
          path: ${{ env.PROJECT_PATH }}/Builds/Android/*.aab

  ios:
    name: iOS Xcode project
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Skip without a Unity licence
        if: env.UNITY_LICENSE == ''
        run: echo "::warning::No UNITY_LICENSE secret, so the iOS build was skipped."
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
        with:
          lfs: true
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: library-ios-${{ hashFiles('games/gahwit-sitti/unity/Packages/packages-lock.json') }}
          restore-keys: library-ios-
      - uses: game-ci/unity-builder@v4
        if: env.UNITY_LICENSE != ''
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildMethod: Gahwit.EditorTools.BuildTools.BuildIos
      # Signing the Xcode project and sending it to TestFlight needs a Mac and an App Store Connect API key:
      # games/gahwit-sitti/tools/ios_testflight.sh does it on a Mac.
      - uses: actions/upload-artifact@v4
        if: env.UNITY_LICENSE != ''
        with:
          name: gahwit-sitti-ios-xcode-${{ github.run_number }}
          path: ${{ env.PROJECT_PATH }}/Builds/iOS
