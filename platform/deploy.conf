# Aqlaan deploy settings for this app, read by ~/Desktop/projects/servers/tools/release.sh. No secrets here: commit it.
APP=games                                 # Portainer stack name, database name and DB role prefix (lowercase)
SERVER=s1
IMAGE=ghcr.io/aqlaangroup/games-platform
VERSION_VAR=GAMES_VERSION                 # the .env key the compose image tag uses
SITE=https://games.aqlaan.com
HEALTH_PATH=/healthz                      # GET -> JSON with "version": "X.Y.Z"
TAG_PREFIX=games-v                        # git tags: games-v1.0.0, games-v1.0.1, ...
BRANCH=research/qahwet-sitti
# Paths baked into the image (relative to this folder); they must be committed before a release. The game files
# match Dockerfile.dockerignore: each game.json, the balance.json it names, the legal pages. No unity/ folder.
SOURCES="src Dockerfile Dockerfile.dockerignore ../games/*/game.json ../games/*/design/balance.json ../games/*/legal/*.html"
CHECKS=deploy/checks.sh                   # dotnet test, before the build
BUILD_CONTEXT=..                          # the repo root: the image needs games/ as well as platform/
DOCKERFILE=Dockerfile
# COMPOSE=docker-compose.yml   (default)
