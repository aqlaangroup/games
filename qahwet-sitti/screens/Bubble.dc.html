<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Bubble offer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F1; color: #2A1D17; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; top: 150px; left: 10px; right: 10px; padding: 6px; background: #F1E9DF; border-radius: 16px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
      <div style="aspect-ratio: 1; border-radius: 9px; background: {{c.bg}}"></div>
    </sc-for>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(42,29,23,0.5)"></div>

  <div style="position: absolute; top: 140px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="width: 150px; height: 150px; border-radius: 50%; background: rgba(220,237,234,0.55); border: 3px solid rgba(255,255,255,0.9); box-shadow: inset -14px -14px 30px rgba(255,255,255,0.5), 0 10px 30px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; position: relative">
      <div style="position: absolute; top: 22px; right: 30px; width: 26px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.8); transform: rotate(30deg)"></div>
      <svg width="86" height="86" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21 h8 l-1-8 q-0.5-4 -3-4 q-2.5 0 -3 4z" fill="#C98E10"></path><path d="M15 12 l6-5" stroke="#C98E10" stroke-width="2" stroke-linecap="round"></path><path d="M9 9 h6 l-1-3 h-4z" fill="#8A5F00"></path><circle cx="12" cy="4.5" r="1.5" fill="#8A5F00"></circle></svg>
    </div>
    <div style="background: #2A1D17; color: #F6D88A; border-radius: 999px; padding: 4px 14px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums">0:42</div>
  </div>

  <div style="position: absolute; bottom: 0; left: 0; right: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-family: 'Rakkas', serif; font-size: 24px">طلعت دلّة نحاس زيادة!</div>
    <div style="font-size: 15px; color: #6E5E55; line-height: 1.6">الدمج الأخير طلّع نسخة ببالونة. بتختفي بعد دقيقة. شايفة شو جوّاها قبل ما تدفعي.</div>
    <div style="display: flex; align-items: center; gap: 10px; background: #F6E8C6; border-radius: 12px; padding: 10px 12px; font-size: 14px">
      <span style="font-weight: 700">دلّة نحاس · مستوى 8</span>
      <span style="color: #6E5E55">= 128 حبّة خضراء</span>
    </div>
    <button type="button" style="height: 54px; border: 0; border-radius: 14px; background: #1D6C67; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      خديها بـ 80
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L20 10 L12 21 L4 10z" fill="#5BB8AE"></path></svg>
    </button>
    <button type="button" style="height: 50px; border: 2px solid #C98E10; border-radius: 14px; background: #F6E8C6; color: #2A1D17; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">شوفي إعلان قصير ببلاش (باقي 2 اليوم)</button>
    <button type="button" style="height: 44px; border: 0; background: transparent; color: #6E5E55; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">لا شكراً</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var cells = [];
    for (var i = 0; i < 42; i++) cells.push({ bg: (i * 7 + 3) % 5 < 2 ? '#FFFFFF' : '#F7F1EA' });
    return { cells: cells };
  }
}
</script>
</body>
</html>
