<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>First merge tutorial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F1; color: #2A1D17; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 16px 10px">
    <div style="font-size: 13px; font-weight: 700; color: #6E5E55">الخطوة {{step}} من 5</div>
    <div style="display: flex; gap: 5px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
        <div style="width: 22px; height: 6px; border-radius: 3px; background: {{d.c}}"></div>
      </sc-for>
    </div>
  </div>

  <div style="margin: 90px 10px 0; padding: 6px; background: #F1E9DF; border-radius: 16px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; position: relative">
    <div style="position: absolute; inset: 0; background: rgba(42,29,23,0.55); border-radius: 16px; z-index: 1"></div>
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
      <div style="aspect-ratio: 1; border-radius: 9px; background: {{c.bg}}; position: relative; z-index: {{c.z}}; display: flex; align-items: center; justify-content: center; box-shadow: {{c.glow}}">
        <sc-if value="{{c.bean}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="6" ry="8.5" transform="rotate(25 12 12)" fill="#8FA36B"></ellipse><path d="M9 6 Q13 12 15 18" stroke="#F1E9DF" stroke-width="1.6" fill="none"></path></svg></sc-if>
      </div>
    </sc-for>
    <svg width="54" height="62" viewBox="0 0 24 28" aria-hidden="true" style="position: absolute; z-index: 3; top: 88px; right: 98px"><path d="M9 26 C5 22 3 18 4 16 C5 14 7 15 8 17 V5 C8 3 11 3 11 5 V13 C11 11 14 11 14 13 C14 11 17 11 17 13 C17 12 20 12 20 14 V19 C20 23 17 26 14 26z" fill="#FFFFFF" stroke="#2A1D17" stroke-width="1.3"></path></svg>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; align-items: flex-end; gap: 10px; padding: 0 14px 28px">
    <div style="width: 70px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center">
      <div style="width: 52px; height: 58px; border-radius: 26px 26px 22px 22px; background: #E8C3A0; box-shadow: inset 0 14px 0 #3A2418"></div>
      <div style="width: 70px; height: 50px; border-radius: 35px 35px 0 0; background: #1D6C67; margin-top: -4px"></div>
    </div>
    <div style="flex: 1; background: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 14px 16px; box-shadow: 0 6px 18px rgba(42,29,23,0.12); display: flex; flex-direction: column; gap: 10px">
      <div style="font-family: 'Rakkas', serif; font-size: 18px; color: #B84A60">سلمى</div>
      <div style="font-size: 17px; line-height: 1.7">{{line}}</div>
      <button type="button" onClick="{{next}}" style="align-self: flex-start; min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px; background: #1D6C67; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">{{btn}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 2 }; }
  renderVals() {
    var self = this, step = this.state.step;
    var lines = {
      1: 'هاي علبة ستّي. كل ضغطة عليها بتطلّع حبّة قهوة، وبتصرف طاقة وحدة.',
      2: 'شايفة الحبّتين الخضر؟ اضغطي على وحدة، وبعدين على التانية. اتنين متشابهين بيصيروا وحدة أحسن.',
      3: 'برافو! هاي حبّة محمّصة. أبو فادي طالبها، اضغطي «قدّمي» عشان تاخدي عملات.',
      4: 'بالعملات بنرمّم القهوة. خلّينا نصلّح الآرمة أول.',
      5: 'كل ما ترمّمي إشي، بنكمّل القصة. يلّا نبلّش!'
    };
    var cells = [];
    for (var i = 0; i < 35; i++) {
      var hl = i === 16 || i === 17;
      cells.push({ bean: hl || i === 9, bg: hl ? '#FFFFFF' : (i === 9 ? '#FFFFFF' : '#F7F1EA'), z: hl ? 2 : 0, glow: hl ? '0 0 0 3px #F6D88A' : 'none' });
    }
    var dots = [1, 2, 3, 4, 5].map(function (n) { return { c: n <= step ? '#1D6C67' : '#E6DCD2' }; });
    return {
      step: step, dots: dots, cells: cells, line: lines[step],
      btn: step < 5 ? 'فهمت' : 'يلّا',
      next: function () { self.setState({ step: step < 5 ? step + 1 : 1 }); }
    };
  }
}
</script>
</body>
</html>
