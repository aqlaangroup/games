<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Merge board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F1; color: #2A1D17; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 18px 14px 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: #B84A60; color: #FFFFFF; font-family: 'Rakkas', serif; font-size: 22px; display: flex; align-items: center; justify-content: center">س</div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-size: 13px; font-weight: 700">المستوى 4</div>
        <div style="width: 64px; height: 6px; border-radius: 3px; background: #E6DCD2"><div style="width: 62%; height: 6px; border-radius: 3px; background: #1D6C67"></div></div>
      </div>
    </div>
    <div style="display: flex; gap: 6px">
      <div style="display: flex; align-items: center; gap: 4px; background: #FFFFFF; border: 1px solid #E6DCD2; border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 14px; font-weight: 700">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 h7 l-1 8 9-12 h-7z" fill="#C98E10"></path></svg>87
      </div>
      <div style="display: flex; align-items: center; gap: 4px; background: #FFFFFF; border: 1px solid #E6DCD2; border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 14px; font-weight: 700">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#C98E10"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#8A5F00" stroke-width="2"></circle></svg>1,240
      </div>
      <div style="display: flex; align-items: center; gap: 4px; background: #FFFFFF; border: 1px solid #E6DCD2; border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 14px; font-weight: 700">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L20 10 L12 21 L4 10z" fill="#1D6C67"></path></svg>35
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 4px 14px 12px">
    <sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
      <div style="flex: 1; min-width: 0; background: #FFFFFF; border: 2px solid {{o.border}}; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="display: flex; align-items: center; gap: 6px; width: 100%">
          <div style="width: 26px; height: 26px; border-radius: 50%; background: {{o.color}}; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{o.initial}}</div>
          <div style="font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.who}}</div>
        </div>
        <div style="font-size: 12px; color: #6E5E55">{{o.want}}</div>
        <sc-if value="{{o.ready}}" hint-placeholder-val="{{true}}">
          <button type="button" style="width: 100%; height: 32px; border: 0; border-radius: 8px; background: #1D6C67; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">قدّمي</button>
        </sc-if>
        <sc-if value="{{o.notReady}}" hint-placeholder-val="{{false}}">
          <div style="width: 100%; height: 32px; border-radius: 8px; background: #F1E9DF; color: #6E5E55; font-size: 12px; display: flex; align-items: center; justify-content: center">+{{o.pay}} عملة</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin: 0 10px; padding: 6px; background: #F1E9DF; border-radius: 16px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="56">
      <div style="aspect-ratio: 1; border-radius: 9px; background: {{c.bg}}; border: 2px solid {{c.ring}}; box-sizing: border-box; position: relative; display: flex; align-items: center; justify-content: center">
        <sc-if value="{{c.bean}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="6" ry="8.5" transform="rotate(25 12 12)" fill="{{c.tint}}"></ellipse><path d="M9 6 Q13 12 15 18" stroke="#F1E9DF" stroke-width="1.6" fill="none"></path></svg></sc-if>
        <sc-if value="{{c.grind}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15 h16 l-2 5 h-12z" fill="#7A4A2A"></path><path d="M6 15 Q12 7 18 15z" fill="#A9774E"></path><circle cx="17" cy="7" r="2" fill="#1D6C67"></circle></svg></sc-if>
        <sc-if value="{{c.pot}}" hint-placeholder-val="{{false}}"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21 h8 l-1-8 q-0.5-4 -3-4 q-2.5 0 -3 4z" fill="#C98E10"></path><path d="M15 12 l6-5" stroke="#C98E10" stroke-width="2" stroke-linecap="round"></path><path d="M9 9 h6 l-1-3 h-4z" fill="#8A5F00"></path><circle cx="12" cy="4.5" r="1.5" fill="#8A5F00"></circle></svg></sc-if>
        <sc-if value="{{c.cup}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9 h12 l-2 8 h-8z" fill="#FFFFFF" stroke="#1D6C67" stroke-width="1.8"></path><path d="M7 11 h10" stroke="#7A4A2A" stroke-width="2"></path><path d="M4 20 h16" stroke="#1D6C67" stroke-width="2" stroke-linecap="round"></path></svg></sc-if>
        <sc-if value="{{c.semo}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20 q-1-8 4-12 h6 q5 4 4 12z" fill="#E9D3A6"></path><path d="M9 8 l-1-3 h8 l-1 3" fill="#D4B77E"></path><circle cx="10" cy="15" r="1" fill="#A9774E"></circle><circle cx="14" cy="13" r="1" fill="#A9774E"></circle></svg></sc-if>
        <sc-if value="{{c.cookie}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="#E9C27A"></circle><circle cx="12" cy="13" r="4.5" fill="none" stroke="#B88A3E" stroke-width="1.4"></circle><circle cx="12" cy="13" r="1.5" fill="#B88A3E"></circle></svg></sc-if>
        <sc-if value="{{c.knafeh}}" hint-placeholder-val="{{false}}"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="15" rx="10" ry="5" fill="#8A5F00"></ellipse><ellipse cx="12" cy="13.5" rx="8.5" ry="4" fill="#E58A2B"></ellipse><circle cx="9" cy="13" r="1" fill="#5C8A3A"></circle><circle cx="13" cy="12.5" r="1" fill="#5C8A3A"></circle><circle cx="15" cy="14.5" r="1" fill="#5C8A3A"></circle></svg></sc-if>
        <sc-if value="{{c.tin}}" hint-placeholder-val="{{false}}"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="7" width="12" height="14" rx="2" fill="#1D6C67"></rect><rect x="5" y="4" width="14" height="4" rx="1.5" fill="#14504C"></rect><path d="M9 13 h6" stroke="#F6D88A" stroke-width="2"></path></svg></sc-if>
        <sc-if value="{{c.sack}}" hint-placeholder-val="{{false}}"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21 q-2-9 3-13 l-1-3 h8 l-1 3 q5 4 3 13z" fill="#D4B77E"></path><path d="M9 8 h6" stroke="#8A5F00" stroke-width="1.6"></path><path d="M10 15 h4" stroke="#B84A60" stroke-width="2"></path></svg></sc-if>
        <sc-if value="{{c.lock}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="#B3A398" stroke-width="1.6"></rect><path d="M4 5 L20 20 M20 5 L4 20" stroke="#D8CBBE" stroke-width="1.2"></path></svg></sc-if>
        <sc-if value="{{c.hasLv}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; left: 2px; bottom: 1px; font-size: 9px; font-weight: 700; color: #6E5E55">{{c.lv}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin: 10px 14px 0; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1px solid #E6DCD2; border-radius: 12px; padding: 8px 12px">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21 h8 l-1-8 q-0.5-4 -3-4 q-2.5 0 -3 4z" fill="#C98E10"></path><path d="M15 12 l6-5" stroke="#C98E10" stroke-width="2" stroke-linecap="round"></path></svg>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 13px; font-weight: 700">دلّة القهوة · مستوى 4</div>
      <div style="font-size: 12px; color: #6E5E55">ادمجي دلّتين عشان تطلع فنجان قهوة لأبو فادي</div>
    </div>
    <button type="button" aria-label="معلومات أكثر" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #DCEDEA; color: #1D6C67; font-family: inherit; font-weight: 700; font-size: 18px; cursor: pointer">؟</button>
  </div>

  <div style="flex-grow: 1"></div>

  <nav style="display: flex; justify-content: space-around; border-top: 1px solid #E6DCD2; background: #FFFFFF; padding: 8px 6px 18px">
    <a href="Cafe.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 44px; color: #6E5E55; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10 L12 3 L21 10 V21 H3z"></path><path d="M9 21 V14 H15 V21"></path></svg>القهوة</a>
    <a href="Board.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 44px; color: #1D6C67; text-decoration: none; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>اللوحة</a>
    <a href="Story.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 44px; color: #6E5E55; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5 h16 v11 h-9 l-5 4 v-4 h-2z"></path></svg>القصة</a>
    <a href="EventsHub.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 44px; color: #6E5E55; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 l2.6 5.6 6 .7 -4.5 4.1 1.2 6 -5.3-3 -5.3 3 1.2-6 -4.5-4.1 6-.7z"></path></svg>الفعاليات</a>
    <a href="Shop.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; min-height: 44px; color: #6E5E55; text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8 h14 l-1 13 h-12z"></path><path d="M9 8 a3 3 0 0 1 6 0"></path></svg>المتجر</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var layout = [
      'tin','bean','bean','roast','-','semo','sack',
      'roast','grind','-','bean','semo','semo','dough',
      '-','pot','pot','grind','cookie','-','dough',
      'bean','-','cup','-','cookie','tray','-',
      'lock','lock','-','roast','-','semo','lock',
      'lock','lock','lock','-','grind','lock','lock',
      'lock','lock','lock','lock','lock','lock','lock',
      'lock','lock','lock','lock','lock','lock','lock'
    ];
    var info = {
      bean: { f: 'bean', lv: 1, tint: '#8FA36B' },
      roast: { f: 'bean', lv: 2, tint: '#6B3F22' },
      grind: { f: 'grind', lv: 3 },
      pot: { f: 'pot', lv: 4, sel: true },
      cup: { f: 'cup', lv: 5 },
      semo: { f: 'semo', lv: 1 },
      dough: { f: 'semo', lv: 2 },
      cookie: { f: 'cookie', lv: 3 },
      tray: { f: 'knafeh', lv: 5 },
      tin: { f: 'tin', gen: true },
      sack: { f: 'sack', gen: true },
      lock: { f: 'lock' }
    };
    var cells = layout.map(function (k) {
      var d = info[k] || {};
      var c = { bean: false, grind: false, pot: false, cup: false, semo: false, cookie: false, knafeh: false, tin: false, sack: false, lock: false };
      if (d.f) c[d.f] = true;
      c.tint = d.tint || '#6B3F22';
      c.lv = d.lv || '';
      c.hasLv = !!d.lv;
      c.bg = d.f === 'lock' ? '#EADFD3' : (d.gen ? '#F6E8C6' : (d.f ? '#FFFFFF' : '#F7F1EA'));
      c.ring = d.sel ? '#C98E10' : (d.gen ? '#C98E10' : 'transparent');
      return c;
    });
    var orders = [
      { who: 'أبو فادي', initial: 'ف', color: '#1D6C67', want: 'فنجان قهوة', pay: 26, ready: true, notReady: false, border: '#1D6C67' },
      { who: 'خالتو سميرة', initial: 'س', color: '#B84A60', want: 'معمول', pay: 12, ready: true, notReady: false, border: '#1D6C67' },
      { who: 'كريم', initial: 'ك', color: '#8A5F00', want: 'دلّتين قهوة', pay: 40, ready: false, notReady: true, border: '#E6DCD2' }
    ];
    return { cells: cells, orders: orders };
  }
}
</script>
</body>
</html>
