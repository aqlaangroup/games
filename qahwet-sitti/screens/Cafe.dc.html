<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Café makeover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F1; color: #2A1D17; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 12px">
    <div>
      <div style="font-family: 'Rakkas', serif; font-size: 26px; line-height: 1.2">القهوة</div>
      <div style="font-size: 13px; color: #6E5E55">المهام اليوم 2 من 5</div>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; background: #FFFFFF; border: 1px solid #E6DCD2; border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 14px; font-weight: 700">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#C98E10"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#8A5F00" stroke-width="2"></circle></svg>1,240
    </div>
  </div>

  <div style="margin: 0 12px; height: 330px; border-radius: 18px; overflow: hidden; position: relative; background: #EDE0D0; flex-shrink: 0">
    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 110px; background-color: #F1E9DF; background-image: radial-gradient(circle at 0 0, #1D6C67 9px, transparent 10px), radial-gradient(circle at 30px 30px, #1D6C67 9px, transparent 10px), radial-gradient(circle at 15px 15px, #C98E10 5px, transparent 6px); background-size: 30px 30px"></div>
    <div style="position: absolute; top: 26px; right: 26px; width: 90px; height: 120px; background: #BFD9D5; border: 7px solid #1D6C67; border-radius: 45px 45px 0 0; box-sizing: border-box"></div>
    <div style="position: absolute; top: 26px; left: 140px; width: 90px; height: 120px; background: #BFD9D5; border: 7px solid #1D6C67; border-radius: 45px 45px 0 0; box-sizing: border-box"></div>
    <div style="position: absolute; top: 46px; left: 22px; width: 96px; height: 66px; border: 3px dashed #C98E10; border-radius: 10px; background: rgba(246,232,198,0.7); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #C98E10; color: #FFFFFF; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center">+</div>
      <div style="font-size: 11px; font-weight: 700; color: #6B4A00">الآرمة</div>
    </div>
    <div style="position: absolute; bottom: 70px; right: 22px; width: 190px; height: 76px; background: #7A4A2A; border-radius: 8px 8px 0 0">
      <div style="height: 12px; background: #2A1D17; border-radius: 8px 8px 0 0"></div>
      <div style="display: flex; gap: 12px; padding: 12px 16px">
        <svg width="26" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21 h8 l-1-8 q-0.5-4 -3-4 q-2.5 0 -3 4z" fill="#C98E10"></path><path d="M15 12 l6-5" stroke="#C98E10" stroke-width="2" stroke-linecap="round"></path></svg>
        <svg width="26" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21 h8 l-1-8 q-0.5-4 -3-4 q-2.5 0 -3 4z" fill="#E9C27A"></path><path d="M15 12 l6-5" stroke="#E9C27A" stroke-width="2" stroke-linecap="round"></path></svg>
      </div>
    </div>
    <div style="position: absolute; bottom: 44px; left: 36px; display: flex; gap: 14px; align-items: flex-end">
      <div style="width: 70px; height: 12px; background: #5A3A22; border-radius: 6px; position: relative; top: -48px"></div>
    </div>
    <div style="position: absolute; bottom: 40px; left: 60px; width: 10px; height: 50px; background: #5A3A22"></div>
    <div style="position: absolute; bottom: 88px; left: 30px; width: 70px; height: 10px; background: #5A3A22; border-radius: 5px"></div>
    <div style="position: absolute; top: 12px; right: 12px; background: #FFFFFF; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; color: #1D6C67">صالة القهوة · 40%</div>
  </div>

  <div style="flex-grow: 1; margin-top: 14px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -6px 20px rgba(42,29,23,0.08); padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 44px; height: 5px; border-radius: 3px; background: #E6DCD2; align-self: center"></div>
    <div>
      <div style="font-family: 'Rakkas', serif; font-size: 22px; line-height: 1.3">اختاري شكل الآرمة</div>
      <div style="font-size: 14px; color: #6E5E55">بتقدري تغيّريها بعدين ببلاش</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{styles}}" as="s" hint-placeholder-count="3">
        <button type="button" onClick="{{s.pick}}" style="display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 8px; border-radius: 14px; border: 3px solid {{s.ring}}; background: #FAF6F1; font-family: inherit; color: #2A1D17; cursor: pointer">
          <div style="height: 64px; border-radius: 8px; background: {{s.bg}}; display: flex; align-items: center; justify-content: center">
            <div style="font-family: 'Rakkas', serif; font-size: 15px; color: {{s.fg}}; border: 2px solid {{s.fg}}; border-radius: {{s.radius}}; padding: 2px 8px">قهوة ستّي</div>
          </div>
          <div style="font-size: 13px; font-weight: 700">{{s.name}}</div>
        </button>
      </sc-for>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; align-items: center; gap: 10px; background: #DCEDEA; border-radius: 12px; padding: 10px 12px; font-size: 13px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14504C" stroke-width="2" aria-hidden="true"><path d="M4 5 h16 v11 h-9 l-5 4 v-4 h-2z"></path></svg>
      <span>بعد ما تركّبيها: مشهد جديد مع أبو فادي</span>
    </div>
    <button type="button" style="height: 56px; border: 0; border-radius: 14px; background: #1D6C67; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
      ركّبي الآرمة · 120
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#F6D88A"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#8A5F00" stroke-width="2"></circle></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'old' }; }
  renderVals() {
    var self = this;
    var list = [
      { id: 'old', name: 'شامي قديم', bg: '#2A1D17', fg: '#F6D88A', radius: '4px' },
      { id: 'modern', name: 'عمّاني حديث', bg: '#FFFFFF', fg: '#1D6C67', radius: '999px' },
      { id: 'gulf', name: 'مجلس خليجي', bg: '#7E2F43', fg: '#F6E8C6', radius: '14px 14px 0 0' }
    ];
    return {
      styles: list.map(function (s) {
        return Object.assign({}, s, {
          ring: self.state.picked === s.id ? '#C98E10' : '#E6DCD2',
          pick: function () { self.setState({ picked: s.id }); }
        });
      })
    };
  }
}
</script>
</body>
</html>
