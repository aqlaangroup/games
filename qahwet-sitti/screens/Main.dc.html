<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Title screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #1D6C67; color: #FAF6F1; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <svg width="390" height="40" aria-hidden="true" style="display: block; flex-shrink: 0">
    <defs>
      <pattern id="t1" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#F1E9DF"></rect>
        <circle cx="0" cy="0" r="11" fill="#1D6C67"></circle><circle cx="40" cy="0" r="11" fill="#1D6C67"></circle>
        <circle cx="0" cy="40" r="11" fill="#1D6C67"></circle><circle cx="40" cy="40" r="11" fill="#1D6C67"></circle>
        <path d="M20 7 L33 20 L20 33 L7 20Z" fill="#C98E10"></path><circle cx="20" cy="20" r="4" fill="#B84A60"></circle>
      </pattern>
    </defs>
    <rect width="390" height="40" fill="url(#t1)"></rect>
  </svg>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 56px 24px 0">
    <div style="font-family: 'Rakkas', serif; font-size: 76px; line-height: 1.1; color: #F6D88A">{{logo}}</div>
    <div style="font-size: 17px; font-weight: 500; color: #DCEDEA">سلمى ولانا، وقهوة ستّهم</div>
  </div>

  <div style="margin: 40px auto 0; width: 300px; display: flex; flex-direction: column; align-items: center">
    <div style="width: 300px; height: 34px; background: repeating-linear-gradient(90deg, #B84A60 0 30px, #FAF6F1 30px 60px); border-radius: 6px 6px 0 0"></div>
    <div style="width: 280px; height: 200px; background: #F1E9DF; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 14px; box-sizing: border-box">
      <div style="background: #2A1D17; color: #F6D88A; font-family: 'Rakkas', serif; font-size: 22px; padding: 4px 18px; border-radius: 4px">قهوة ستّي · منذ 1974</div>
      <div style="display: flex; gap: 18px; align-items: flex-end">
        <div style="width: 70px; height: 80px; background: #F6E8C6; border: 5px solid #1D6C67; border-radius: 36px 36px 0 0; box-sizing: border-box"></div>
        <div style="width: 70px; height: 120px; background: #14504C; border-radius: 36px 36px 0 0; display: flex; justify-content: flex-start; align-items: center; padding-left: 10px; box-sizing: border-box">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #F6D88A"></div>
        </div>
        <div style="width: 70px; height: 80px; background: #F6E8C6; border: 5px solid #1D6C67; border-radius: 36px 36px 0 0; box-sizing: border-box"></div>
      </div>
    </div>
    <div style="width: 320px; height: 12px; background: #2A1D17; border-radius: 3px"></div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 32px 28px">
    <a href="AgeGate.dc.html" style="width: 100%; height: 60px; border-radius: 16px; background: #F6D88A; color: #2A1D17; text-decoration: none; font-family: 'Rakkas', serif; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #8A5F00">العبي</a>
    <div style="display: flex; gap: 12px; width: 100%">
      <button type="button" style="flex: 1; height: 46px; border-radius: 12px; border: 2px solid #DCEDEA; background: transparent; color: #FAF6F1; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">احفظي تقدّمك</button>
      <button type="button" style="flex: 1; height: 46px; border-radius: 12px; border: 2px solid #DCEDEA; background: transparent; color: #FAF6F1; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">English</button>
    </div>
    <div style="font-size: 12px; color: #BFD9D5">نسخة تجريبية 0.1</div>
  </div>

  <svg width="390" height="40" aria-hidden="true" style="display: block; flex-shrink: 0">
    <rect width="390" height="40" fill="url(#t1)"></rect>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { logo: 'قهوة ستّي' };
  }
}
</script>
</body>
</html>
