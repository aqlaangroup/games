<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Story journal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F1; color: #2A1D17; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 16px 6px">
    <div style="font-family: 'Rakkas', serif; font-size: 28px">القصة</div>
    <div style="font-size: 14px; color: #6E5E55">الموسم الأول · رجعة سلمى · 3 من 10 فصول</div>
  </div>

  <div style="display: flex; gap: 8px; padding: 8px 16px; overflow: hidden">
    <sc-for list="{{cast}}" as="p" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px; width: 54px; flex-shrink: 0">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: {{p.c}}; color: #FFFFFF; font-family: 'Rakkas', serif; font-size: {{p.fs}}; display: flex; align-items: center; justify-content: center; border: 3px solid {{p.ring}}; box-sizing: border-box">{{p.i}}</div>
        <div style="font-size: 11px; font-weight: 600; white-space: nowrap">{{p.n}}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 6px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{chapters}}" as="ch" hint-placeholder-count="6">
      <button type="button" onClick="{{ch.pick}}" style="text-align: right; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 2px solid {{ch.ring}}; background: {{ch.bg}}; font-family: inherit; color: #2A1D17; cursor: pointer; min-height: 60px">
        <div style="width: 38px; height: 38px; border-radius: 10px; background: {{ch.numBg}}; color: {{ch.numFg}}; font-family: 'Rakkas', serif; font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{ch.n}}</div>
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 700">{{ch.t}}</div>
          <div style="font-size: 12px; color: #6E5E55">{{ch.sub}}</div>
        </div>
      </button>
      <sc-if value="{{ch.open}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 12px 4px 0">
          <sc-for list="{{ch.scenes}}" as="s" hint-placeholder-count="6">
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 8px 12px; border-radius: 10px; background: {{s.bg}}; color: {{s.fg}}">
              <span>{{s.t}}</span><span style="font-size: 12px; font-weight: 700">{{s.tag}}</span>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </sc-for>
  </div>
  <div style="padding: 10px 16px 22px; font-size: 12px; color: #6E5E55; text-align: center">اضغطي على أي مشهد شفتيه عشان تعيديه</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 3 }; }
  renderVals() {
    var self = this;
    var cast = [
      { n: 'سلمى', i: 'س', c: '#B84A60' }, { n: 'لانا', i: 'ل', c: '#4C6B2E' }, { n: 'خالتو', i: 'خ', c: '#7E2F43' },
      { n: 'أبو فادي', i: 'ف', c: '#1D6C67' }, { n: 'كريم', i: 'ك', c: '#7A4A2A' }, { n: 'ستّي', i: 'ستّي', c: '#8A5F00' }
    ].map(function (p) { return Object.assign({ fs: p.i.length > 1 ? '14px' : '22px', ring: '#FAF6F1' }, p); });
    var list = [
      { n: 1, t: 'رجعة سلمى', state: 'done' }, { n: 2, t: 'خطط خالتو', state: 'done' },
      { n: 3, t: 'لانا من الرياض', state: 'cur', seen: 4 }, { n: 4, t: 'دلال ستّي', state: 'lock' },
      { n: 5, t: 'قهوتين', state: 'lock' }, { n: 6, t: 'الافتتاح', state: 'lock' }
    ];
    var scenes3 = ['لانا على الباب', 'نصّ القهوة؟!', 'شاي على أصوله', 'أول خلاف', 'سهرة على الدرج', 'اتفاق مؤقت'];
    return {
      cast: cast,
      chapters: list.map(function (c) {
        var open = self.state.open === c.n && c.state !== 'lock';
        return {
          n: c.n, t: c.state === 'lock' ? 'فصل مقفول' : c.t,
          sub: c.state === 'done' ? '6 من 6 مشاهد · خلص' : c.state === 'cur' ? c.seen + ' من 6 مشاهد' : 'بيفتح لما تخلصي اللي قبله',
          ring: c.state === 'cur' ? '#C98E10' : '#E6DCD2', bg: c.state === 'lock' ? '#F1E9DF' : '#FFFFFF',
          numBg: c.state === 'done' ? '#1D6C67' : c.state === 'cur' ? '#F6E8C6' : '#E6DCD2',
          numFg: c.state === 'done' ? '#FFFFFF' : '#2A1D17',
          open: open,
          scenes: scenes3.map(function (s, i) {
            var seen = i < (c.seen || 6);
            return { t: seen ? s : 'مشهد مقفول', tag: seen ? 'شوفي ↺' : '', bg: seen ? '#DCEDEA' : '#F1E9DF', fg: seen ? '#14504C' : '#6E5E55' };
          }),
          pick: function () { self.setState({ open: self.state.open === c.n ? 0 : c.n }); }
        };
      })
    };
  }
}
</script>
</body>
</html>
