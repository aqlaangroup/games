<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Season pass</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F1; color: #2A1D17; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="background: #7E2F43; color: #FAF6F1; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="EventsHub.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; color: #FAF6F1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 5 l7 7 -7 7"></path></svg>
      </a>
      <div style="font-size: 13px; font-weight: 700">باقي 16 يوم</div>
    </div>
    <div style="font-family: 'Rakkas', serif; font-size: 30px; color: #F6D88A; line-height: 1.2">تذكرة الموسم · موسم الياسمين</div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 46px; height: 46px; border-radius: 12px; background: #F6D88A; color: #2A1D17; font-family: 'Rakkas', serif; font-size: 24px; display: flex; align-items: center; justify-content: center">12</div>
      <div style="flex: 1">
        <div style="display: flex; justify-content: space-between; font-size: 13px"><span>للدرجة 13</span><span style="font-variant-numeric: tabular-nums">260 / 400</span></div>
        <div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.2); margin-top: 5px"><div style="height: 8px; border-radius: 4px; width: 65%; background: #F6D88A"></div></div>
      </div>
    </div>
    <div style="font-size: 12px; color: #F6E8C6">كل طاقة بتصرفيها = نقطة</div>
  </div>

  <div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 12px 14px 6px; font-size: 13px; font-weight: 700; color: #6E5E55">
    <span></span><span>ببلاش</span><span style="color: #7E2F43">الذهبية</span>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 0 14px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{tiers}}" as="t" hint-placeholder-count="7">
      <div style="display: grid; grid-template-columns: 48px minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: stretch">
        <div style="border-radius: 10px; background: {{t.numBg}}; color: {{t.numFg}}; font-family: 'Rakkas', serif; font-size: 20px; display: flex; align-items: center; justify-content: center">{{t.n}}</div>
        <div style="border-radius: 12px; background: #FFFFFF; border: 2px solid {{t.freeRing}}; padding: 8px 10px; font-size: 13px; font-weight: 600; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 6px; opacity: {{t.op}}">
          <span>{{t.free}}</span><sc-if value="{{t.claimed}}" hint-placeholder-val="{{false}}"><span style="color: #1D6C67">✓</span></sc-if>
        </div>
        <div style="border-radius: 12px; background: #F6E8C6; border: 2px solid #E9C27A; padding: 8px 10px; font-size: 13px; font-weight: 600; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 6px; opacity: {{t.op}}">
          <span>{{t.prem}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A5F00" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11 V8 a4 4 0 0 1 8 0 V11"></path></svg>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 14px 22px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; border-top: 1px solid #E6DCD2">
    <div style="font-size: 13px; color: #6E5E55">الذهبية بتفتح: طقم ياسمين للسطح، فستان لسلمى، ومشهد قصير خاص مع لانا</div>
    <button type="button" style="height: 54px; border: 0; border-radius: 14px; background: #7E2F43; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">افتحي الذهبية · [السعر] ر.س</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = [
      [10, '10 جواهر', 'نسخة علبة ستّي'], [11, '50 طاقة', '30 جوهرة'], [12, '200 عملة', 'فانوس ياسمين'],
      [13, '5 جواهر', '100 طاقة'], [14, 'رزمة صور', 'كرسي خيزران'], [15, '100 طاقة', 'فستان ياسمين لسلمى'], [16, '15 جوهرة', 'مشهد خاص مع لانا']
    ];
    return {
      tiers: rows.map(function (r) {
        var done = r[0] <= 12;
        return {
          n: r[0], free: r[1], prem: r[2], claimed: done, op: r[0] <= 13 ? 1 : 0.6,
          numBg: done ? '#7E2F43' : '#E6DCD2', numFg: done ? '#FFFFFF' : '#2A1D17',
          freeRing: r[0] === 12 ? '#C98E10' : '#E6DCD2'
        };
      })
    };
  }
}
</script>
</body>
</html>
