<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Out of energy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #4A3A31; color: #2A1D17; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px">
  <div style="width: 100%; background: #FAF6F1; border-radius: 24px; padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 12px; position: relative">
    <a href="Board.dc.html" aria-label="سكّري" style="position: absolute; top: 12px; left: 12px; width: 44px; height: 44px; border-radius: 50%; background: #F1E9DF; display: flex; align-items: center; justify-content: center; color: #2A1D17">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px">
      <div style="width: 84px; height: 84px; border-radius: 50%; background: #F6E8C6; display: flex; align-items: center; justify-content: center">
        <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 h7 l-1 8 9-12 h-7z" fill="#C98E10" opacity="0.35"></path><path d="M13 2 L4 14 h7 l-1 8 9-12 h-7z" fill="none" stroke="#8A5F00" stroke-width="1.5"></path></svg>
      </div>
      <div style="font-family: 'Rakkas', serif; font-size: 28px">خلصت الطاقة</div>
      <div style="font-size: 15px; color: #6E5E55">بتمتلي لحالها بعد <b style="color: #2A1D17; font-variant-numeric: tabular-nums">3:18:40</b></div>
      <div style="width: 100%; height: 10px; border-radius: 5px; background: #E6DCD2; margin-top: 4px"><div style="width: 2%; height: 10px; border-radius: 5px; background: #C98E10"></div></div>
    </div>

    <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
      <button type="button" onClick="{{o.pick}}" style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; border: 2px solid {{o.ring}}; background: #FFFFFF; font-family: inherit; color: #2A1D17; text-align: right; cursor: pointer">
        <div style="flex: 1; min-width: 0">
          <div style="font-size: 16px; font-weight: 700">{{o.title}}</div>
          <div style="font-size: 13px; color: #6E5E55">{{o.sub}}</div>
        </div>
        <div style="min-width: 74px; height: 40px; border-radius: 10px; background: {{o.tagBg}}; color: {{o.tagFg}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 10px">{{o.tag}}</div>
      </button>
    </sc-for>
    <div style="font-size: 12px; color: #6E5E55; text-align: center">نصيحة: بيعي القطع الصغيرة اللي ما بتلزمك، أو كمّلي دمج اللي عندك على اللوحة.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 0 }; }
  renderVals() {
    var self = this;
    var raw = [
      { title: '+25 طاقة', sub: 'إعلان قصير · باقي 3 من 5 اليوم', tag: 'ببلاش', tagBg: '#F6E8C6', tagFg: '#6B4A00' },
      { title: '+100 طاقة', sub: 'أول شراء اليوم', tag: '30 جوهرة', tagBg: '#DCEDEA', tagFg: '#14504C' },
      { title: '+5 من الأصحاب', sub: 'وصلتك هدية من نور وريم', tag: 'خديها', tagBg: '#DCEDEA', tagFg: '#14504C' },
      { title: 'باكيت طاقة: 500 + 20 جوهرة', sub: 'من المتجر', tag: '[السعر]', tagBg: '#1D6C67', tagFg: '#FFFFFF' }
    ];
    return {
      options: raw.map(function (o, i) {
        return Object.assign({}, o, { ring: self.state.picked === i ? '#C98E10' : '#E6DCD2', pick: function () { self.setState({ picked: i }); } });
      })
    };
  }
}
</script>
</body>
</html>
