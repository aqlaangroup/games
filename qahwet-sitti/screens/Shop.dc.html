<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF6F1; color: #2A1D17; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 12px">
    <a href="Board.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E6DCD2; display: flex; align-items: center; justify-content: center; color: #2A1D17; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 5 l7 7 -7 7"></path></svg>
    </a>
    <div style="font-family: 'Rakkas', serif; font-size: 26px">المتجر</div>
    <div style="display: flex; align-items: center; gap: 4px; background: #FFFFFF; border: 1px solid #E6DCD2; border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 14px; font-weight: 700">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L20 10 L12 21 L4 10z" fill="#1D6C67"></path></svg>35
    </div>
  </div>

  <div style="margin: 0 14px; border-radius: 20px; background: #7E2F43; color: #FAF6F1; padding: 18px; display: flex; gap: 14px; align-items: center; position: relative; overflow: hidden">
    <div style="position: absolute; top: 12px; left: 12px; background: #F6D88A; color: #2A1D17; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700">لمدّة محدودة</div>
    <div style="width: 96px; height: 96px; border-radius: 16px; background: #B84A60; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="64" height="64" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="16" height="12" rx="2" fill="#F6D88A"></rect><rect x="3" y="6" width="18" height="4" rx="1.5" fill="#C98E10"></rect><path d="M12 6 V21" stroke="#B84A60" stroke-width="2"></path><path d="M12 6 q-4 -5 -6 -1 q2 2 6 1 q4 1 6 -1 q-2 -4 -6 1z" fill="#C98E10"></path></svg>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 14px">
      <div style="font-family: 'Rakkas', serif; font-size: 24px; line-height: 1.2">باقة العيد</div>
      <div style="font-size: 13px; color: #F6E8C6">فستان العيد لسلمى + زينة الصالة + 60 جوهرة</div>
      <button type="button" style="margin-top: 6px; height: 44px; border: 0; border-radius: 12px; background: #F6D88A; color: #2A1D17; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">[السعر] ر.س</button>
    </div>
  </div>

  <div style="padding: 18px 16px 8px; font-size: 15px; font-weight: 700">جواهر</div>
  <div style="padding: 0 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{packs}}" as="p" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border: 2px solid {{p.ring}}; border-radius: 16px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative">
        <sc-if value="{{p.best}}" hint-placeholder-val="{{false}}">
          <div style="position: absolute; top: -10px; background: #1D6C67; color: #FFFFFF; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700">الأكثر طلباً</div>
        </sc-if>
        <svg width="{{p.size}}" height="{{p.size}}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L20 10 L12 21 L4 10z" fill="#1D6C67"></path><path d="M12 3 L15 10 L12 21 L9 10z" fill="#5BB8AE"></path></svg>
        <div style="font-size: 16px; font-weight: 700">{{p.qty}}</div>
        <button type="button" style="width: 100%; height: 44px; border: 0; border-radius: 10px; background: #DCEDEA; color: #14504C; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">[السعر] ر.س</button>
      </div>
    </sc-for>
  </div>

  <div style="padding: 18px 16px 8px; font-size: 15px; font-weight: 700">تذكرة الموسم</div>
  <div style="margin: 0 14px; background: #FFFFFF; border: 1px solid #E6DCD2; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px">
    <div style="width: 52px; height: 52px; border-radius: 12px; background: #F6E8C6; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A5F00" stroke-width="2" aria-hidden="true"><path d="M4 7 h16 v3 a2 2 0 0 0 0 4 v3 h-16 v-3 a2 2 0 0 0 0 -4z"></path><path d="M10 7 v10" stroke-dasharray="2 2"></path></svg>
    </div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 15px; font-weight: 700">فصل حصري كل شهر</div>
      <div style="font-size: 13px; color: #6E5E55">طاقة إضافية يومياً وديكور خاص بالموسم</div>
    </div>
    <button type="button" style="height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: #1D6C67; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">اشتركي</button>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px; align-items: center">
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px">
      <span style="border: 1px solid #E6DCD2; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: #FFFFFF">مدى</span>
      <span style="border: 1px solid #E6DCD2; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: #FFFFFF">Apple Pay</span>
      <span style="border: 1px solid #E6DCD2; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: #FFFFFF">STC Pay</span>
      <span style="border: 1px solid #E6DCD2; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: #FFFFFF">فاتورة الجوال</span>
    </div>
    <div style="font-size: 12px; color: #6E5E55">ما في صناديق حظ. كل شي بتشتريه بتعرفي شو هو.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { qty: 100, size: 28 }, { qty: 275, size: 32 }, { qty: 600, size: 36, best: true },
      { qty: 1300, size: 40 }, { qty: 3500, size: 44 }, { qty: 7500, size: 48 }
    ];
    return {
      packs: raw.map(function (p) {
        return { qty: p.qty.toLocaleString('en-US'), size: p.size, best: !!p.best, ring: p.best ? '#1D6C67' : '#E6DCD2' };
      })
    };
  }
}
</script>
</body>
</html>
