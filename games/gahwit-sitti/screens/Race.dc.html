<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Coffee race</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F6D88A}a:hover{color:#FFFFFF}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #1D6C67; color: #FAF6F1; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 16px 8px; display: flex; justify-content: space-between; align-items: center">
    <a href="EventsHub.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; color: #FAF6F1">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 5 l7 7 -7 7"></path></svg>
    </a>
    <div style="background: rgba(255,255,255,0.14); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700">باقي 21:14:05</div>
  </div>
  <div style="padding: 4px 18px 14px">
    <div style="font-family: 'Rakkas', serif; font-size: 36px; color: #F6D88A; line-height: 1.1">سباق القهوة</div>
    <div style="font-size: 14px; color: #DCEDEA">أول وحدة بتقدّم 30 طلب بتربح. كل طلب = نقطة.</div>
  </div>

  <div style="margin: 0 14px; background: #FAF6F1; color: #2A1D17; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{racers}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 12px; background: {{r.rowBg}}">
        <div style="width: 26px; font-family: 'Rakkas', serif; font-size: 20px; text-align: center; color: {{r.placeC}}">{{r.place}}</div>
        <div style="width: 38px; height: 38px; border-radius: 50%; background: {{r.c}}; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{r.i}}</div>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700"><span>{{r.n}}</span><span style="font-variant-numeric: tabular-nums">{{r.score}}/30</span></div>
          <div style="height: 8px; border-radius: 4px; background: #E6DCD2; margin-top: 5px"><div style="height: 8px; border-radius: 4px; width: {{r.pct}}; background: {{r.bar}}"></div></div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px 16px 8px; font-size: 15px; font-weight: 700">الجوائز</div>
  <div style="padding: 0 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{prizes}}" as="p" hint-placeholder-count="3">
      <div style="background: {{p.bg}}; color: #2A1D17; border-radius: 14px; padding: 10px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px">
        <div style="font-family: 'Rakkas', serif; font-size: 20px">{{p.place}}</div>
        <div style="font-size: 13px; font-weight: 700">{{p.gems}} جوهرة</div>
        <div style="font-size: 12px; color: #6E5E55">{{p.energy}}</div>
      </div>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="padding: 0 16px 8px; font-size: 12px; color: #BFD9D5; text-align: center">المتسابقات بأسماء مستعارة. ما في دردشة ولا صور حقيقية.</div>
  <a href="Board.dc.html" style="margin: 0 16px 24px; height: 56px; border-radius: 16px; background: #F6D88A; color: #2A1D17; text-decoration: none; font-family: 'Rakkas', serif; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #8A5F00">يلّا قدّمي طلبات</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { n: 'ريم_الجدّاوية', i: 'ر', c: '#7E2F43', s: 21 },
      { n: 'إنتِ (سلمى)', i: 'س', c: '#B84A60', s: 18, me: true },
      { n: 'نور.عمّان', i: 'ن', c: '#4C6B2E', s: 15 },
      { n: 'قهوة_الصبح', i: 'ق', c: '#8A5F00', s: 9 },
      { n: 'هيا', i: 'ه', c: '#5E8A86', s: 4 }
    ];
    return {
      racers: raw.map(function (r, i) {
        return {
          n: r.n, i: r.i, c: r.c, score: r.s, place: i + 1, pct: Math.round(r.s / 30 * 100) + '%',
          bar: r.me ? '#C98E10' : '#1D6C67', rowBg: r.me ? '#F6E8C6' : 'transparent', placeC: i < 3 ? '#8A5F00' : '#6E5E55'
        };
      }),
      prizes: [
        { place: 'الأولى', gems: 40, energy: '+100 طاقة', bg: '#F6D88A' },
        { place: 'التانية', gems: 20, energy: '+50 طاقة', bg: '#FAF6F1' },
        { place: 'التالتة', gems: 10, energy: '—', bg: '#FAF6F1' }
      ]
    };
  }
}
</script>
</body>
</html>
