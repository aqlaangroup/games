<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Daily gift</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rakkas&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D6C67}a:hover{color:#14504C}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #4A3A31; color: #2A1D17; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px">
  <div style="width: 100%; background: #FAF6F1; border-radius: 24px; padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 14px; position: relative">
    <div style="text-align: center">
      <div style="font-family: 'Rakkas', serif; font-size: 30px; color: #1D6C67">هدية اليوم</div>
      <div style="font-size: 14px; color: #6E5E55">ارجعي كل يوم، واليوم السابع إلو هدية خاصة</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="6">
        <div style="border-radius: 14px; padding: 10px 6px; background: {{d.bg}}; border: 3px solid {{d.ring}}; display: flex; flex-direction: column; align-items: center; gap: 6px; opacity: {{d.op}}">
          <div style="font-size: 12px; font-weight: 700; color: #6E5E55">اليوم {{d.n}}</div>
          <sc-if value="{{d.isEnergy}}" hint-placeholder-val="{{true}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 h7 l-1 8 9-12 h-7z" fill="#C98E10"></path></svg></sc-if>
          <sc-if value="{{d.isCoins}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#C98E10"></circle><circle cx="12" cy="12" r="5" fill="none" stroke="#8A5F00" stroke-width="2"></circle></svg></sc-if>
          <sc-if value="{{d.isGems}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L20 10 L12 21 L4 10z" fill="#1D6C67"></path><path d="M12 3 L15 10 L12 21 L9 10z" fill="#5BB8AE"></path></svg></sc-if>
          <div style="font-size: 15px; font-weight: 700">{{d.amount}}</div>
          <sc-if value="{{d.claimed}}" hint-placeholder-val="{{false}}"><div style="font-size: 11px; font-weight: 700; color: #14504C">أخدتيها</div></sc-if>
        </div>
      </sc-for>
    </div>
    <div style="border-radius: 16px; padding: 12px 14px; background: #7E2F43; color: #FAF6F1; display: flex; align-items: center; gap: 12px">
      <div style="width: 54px; height: 54px; border-radius: 12px; background: #B84A60; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="8" rx="4" fill="#F6D88A"></rect><path d="M6 11 q6 -6 12 0" fill="#E9C27A"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 12px; color: #F6E8C6">اليوم 7</div>
        <div style="font-size: 16px; font-weight: 700">20 جوهرة + مخدّة ستّي المطرّزة</div>
      </div>
    </div>
    <button type="button" style="height: 56px; border: 0; border-radius: 14px; background: #1D6C67; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer">خدي هدية اليوم</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { k: 'e', a: 25 }, { k: 'c', a: 50 }, { k: 'g', a: 5 },
      { k: 'e', a: 50 }, { k: 'c', a: 100 }, { k: 'g', a: 10 }
    ];
    var today = 3;
    return {
      days: raw.map(function (d, i) {
        var n = i + 1;
        return {
          n: n, amount: d.a, isEnergy: d.k === 'e', isCoins: d.k === 'c', isGems: d.k === 'g',
          claimed: n < today, op: n < today ? 0.55 : 1,
          bg: n === today ? '#F6E8C6' : '#FFFFFF', ring: n === today ? '#C98E10' : '#E6DCD2'
        };
      })
    };
  }
}
</script>
</body>
</html>
