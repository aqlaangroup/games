<title>Gahwit Sitti 3D Café</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: the 3D café fills the screen; frosted controls float on top (stats above, decor tray below). Single soft look by design; night lives inside the scene. */
:root {
  color-scheme: light;
  --bg: #FBF5F3;
  --ink: #3A2731;
  --muted: #806A76;
  --rose: #C8697A;
  --rose-soft: #F6E3E3;
  --glass: rgba(255, 255, 255, .78);
  --line: rgba(58, 39, 49, .08);
  --shadow: 0 10px 30px rgba(58, 39, 49, .14);
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Arabic", "SF Pro Text", system-ui, "Noto Sans Arabic", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
.glass { background: var(--glass); backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%); box-shadow: var(--shadow); }

.top { position: fixed; z-index: 5; top: max(12px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { border-radius: 20px; padding: 10px 14px; display: grid; gap: 2px; }
.brand b { font-size: 17px; }
.brand span { font-size: 12px; color: var(--muted); }
.stats { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.pill { border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; }
.pill small { font-weight: 500; color: var(--muted); font-size: 12px; }

.time { position: fixed; z-index: 5; top: calc(max(12px, env(safe-area-inset-top, 0px)) + 78px); left: 50%; transform: translateX(-50%); border-radius: 999px; padding: 4px; display: flex; gap: 2px; }
.time button { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
.time button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(58,39,49,.12); }

.tray { position: fixed; z-index: 5; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); border-radius: 26px; padding: 12px; display: grid; gap: 10px; max-width: 560px; margin: 0 auto; }
.tray-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px; }
.tray-head b { font-size: 15px; }
.styles { display: flex; gap: 4px; background: rgba(58,39,49,.05); border-radius: 999px; padding: 3px; }
.styles button { height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); }
.styles button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 6px rgba(58,39,49,.12); }
.items { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.item { border-radius: 18px; background: #fff; padding: 8px 4px 6px; display: grid; justify-items: center; gap: 2px; box-shadow: inset 0 0 0 1px var(--line); transition: transform .2s; min-height: 76px; }
.item:active { transform: scale(.95); }
.item[aria-pressed="true"] { box-shadow: inset 0 0 0 2.5px var(--rose); background: var(--rose-soft); }
.item svg { width: 34px; height: 34px; }
.item span { font-size: 12px; font-weight: 600; }
.item small { font-size: 11px; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); text-align: center; min-height: 1.3em; }

.toast { position: fixed; z-index: 8; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, -60%); }
.reset { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(max(12px, env(safe-area-inset-top, 0px)) + 78px); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; }
.reset svg { width: 20px; height: 20px; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; font-size: 16px; color: var(--muted); }
@media (max-width: 420px) { .brand span { display: none; } .item small { display: none; } }
@media (prefers-reduced-motion: reduce) { .toast, .item { transition: none; } }
</style>

<div id="stage" aria-label="مقهى ثلاثي الأبعاد"></div>
<div class="fallback" id="fallback" hidden>المتصفح هاد ما بيدعم الرسم ثلاثي الأبعاد. جرّبي متصفح أحدث.</div>

<div class="top" dir="rtl">
  <div class="brand glass"><b>قهوة ستّي</b><span>مثال على المستوى B · اسحبي للّف وقرّبي بإصبعين</span></div>
  <div class="stats">
    <span class="pill glass" title="العملات"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#D9A55B"/><circle cx="12" cy="12" r="5" fill="none" stroke="#9B6E2F" stroke-width="2"/></svg><span id="coins">120</span></span>
    <span class="pill glass" title="الدفا"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21 C5 15 2 12 2 8 a5 5 0 0 1 10 -1 a5 5 0 0 1 10 1 c0 4 -3 7 -10 13z" fill="#E9A0AE"/></svg><span id="cosy">0</span><small>دفا</small></span>
  </div>
</div>
<div class="time glass" dir="rtl" role="group" aria-label="وقت النهار">
  <button type="button" data-t="morning" aria-pressed="true">صبح</button>
  <button type="button" data-t="evening" aria-pressed="false">عصر</button>
  <button type="button" data-t="night" aria-pressed="false">ليل</button>
</div>
<button class="reset glass" id="reset" type="button" aria-label="رجّعي الكاميرا"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 12 a8 8 0 1 0 3 -6.2"/><path d="M4 4 v4 h4"/></svg></button>

<div class="tray glass" dir="rtl">
  <div class="tray-head">
    <b>زيّني القهوة</b>
    <div class="styles" role="group" aria-label="الستايل">
      <button type="button" data-s="old" aria-pressed="true">شامي قديم</button>
      <button type="button" data-s="modern" aria-pressed="false">عمّاني</button>
      <button type="button" data-s="gulf" aria-pressed="false">خليجي</button>
    </div>
  </div>
  <div class="items" id="items"></div>
  <div class="hint" id="hint">اختاري قطعة، وبعدين دقّي على الأرض لتحطّيها. دقّي على الزبون لتقدّميله قهوة.</div>
</div>
<div class="toast glass" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  if (!window.THREE) { $("fallback").hidden = false; return; }
  var T = THREE;

  /* ---------- Renderer, scene, camera ---------- */
  var stage = $("stage");
  var renderer;
  try { renderer = new T.WebGLRenderer({ antialias: true }); } catch (e) { $("fallback").hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .82;
  stage.appendChild(renderer.domElement);

  var scene = new T.Scene();
  scene.background = new T.Color("#F3E4E4");
  var camera = new T.PerspectiveCamera(34, 1, .1, 100);
  var target = new T.Vector3(0, .9, 0);
  var orbit = { theta: .62, phi: 1.02, radius: 17 };
  var HOME = { theta: .62, phi: 1.02, radius: 17 }, touched = false;
  function placeCamera() {
    var r = orbit.radius;
    camera.position.set(target.x + r * Math.sin(orbit.phi) * Math.sin(orbit.theta), target.y + r * Math.cos(orbit.phi), target.z + r * Math.sin(orbit.phi) * Math.cos(orbit.theta));
    camera.lookAt(target);
  }
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < 600 ? 40 : 34; camera.updateProjectionMatrix();
    HOME.radius = camera.aspect < .75 ? 24 : 17;
    if (!touched) orbit.radius = HOME.radius;
  }

  /* ---------- Materials ---------- */
  function mat(c, o) { return new T.MeshStandardMaterial(Object.assign({ color: c, roughness: .88, metalness: 0 }, o || {})); }
  var M = {
    wall: mat("#EED1CC"), wallLow: mat("#E2B3AE"), trim: mat("#FFFFFF"),
    wood: mat("#C99E83"), woodDark: mat("#A57A62"), counter: mat("#FFFFFF"), counterTop: mat("#F2D3D6"),
    brass: mat("#D9B06C", { roughness: .35, metalness: .6 }), lilac: mat("#D8CDEB"), sage: mat("#B9D1BE"), leaf: mat("#9DBFA6"),
    pot: mat("#E7B4BE"), glass: new T.MeshBasicMaterial({ color: "#D7E4F2" }), cup: mat("#FFFFFF", { roughness: .4 }), black: mat("#3A2731", { roughness: .5 })
  };

  /* Cement-tile floor painted on a canvas. */
  function tileTexture() {
    var c = document.createElement("canvas"); c.width = c.height = 256; var g = c.getContext("2d");
    g.fillStyle = "#F1E1DA"; g.fillRect(0, 0, 256, 256);
    g.fillStyle = "#A9C7B2";
    [[0, 0], [256, 0], [0, 256], [256, 256]].forEach(function (p) { g.beginPath(); g.arc(p[0], p[1], 70, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = "#DFA0AD"; g.beginPath(); g.moveTo(128, 50); g.lineTo(206, 128); g.lineTo(128, 206); g.lineTo(50, 128); g.closePath(); g.fill();
    g.fillStyle = "#F1E1DA"; g.beginPath(); g.arc(128, 128, 26, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "rgba(58,39,49,.08)"; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
    var t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(10, 8); t.encoding = T.sRGBEncoding; t.anisotropy = 4;
    return t;
  }

  /* ---------- Room ---------- */
  var W = 10, D = 8, H = 4.6;
  var floor = new T.Mesh(new T.BoxGeometry(W, .2, D), mat("#ffffff", { map: tileTexture() }));
  floor.position.y = -.1; floor.receiveShadow = true; scene.add(floor);
  var base = new T.Mesh(new T.BoxGeometry(W + .4, .5, D + .4), mat("#E9D3CC")); base.position.y = -.45; scene.add(base);

  function wall(w, h, x, z, ry) {
    var g = new T.Group();
    var up = new T.Mesh(new T.BoxGeometry(w, h, .2), M.wall); up.position.y = h / 2; up.receiveShadow = true; g.add(up);
    var low = new T.Mesh(new T.BoxGeometry(w, 1.2, .24), M.wallLow); low.position.y = .6; low.receiveShadow = true; g.add(low);
    var rail = new T.Mesh(new T.BoxGeometry(w, .08, .3), M.trim); rail.position.y = 1.22; g.add(rail);
    g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g); return g;
  }
  wall(W, H, 0, -D / 2 - .1, 0);
  wall(D, H, -W / 2 - .1, 0, Math.PI / 2);

  function arch(w, h) {
    var s = new T.Shape(), r = w / 2;
    s.moveTo(-r, 0); s.lineTo(-r, h - r); s.absarc(0, h - r, r, Math.PI, 0, true); s.lineTo(r, 0); s.lineTo(-r, 0);
    return s;
  }
  // Arched window on the back wall: frame, glass (sky changes with time), sill.
  var winFrame = new T.Mesh(new T.ExtrudeGeometry(arch(2.2, 2.9), { depth: .12, bevelEnabled: false }), M.trim);
  winFrame.position.set(-1.6, 1.45, -D / 2 + .02); scene.add(winFrame);
  var sky = new T.Mesh(new T.ShapeGeometry(arch(1.9, 2.65)), M.glass); sky.position.set(-1.6, 1.58, -D / 2 + .15); scene.add(sky);
  var mullion = new T.Mesh(new T.BoxGeometry(.06, 2.4, .05), M.trim); mullion.position.set(-1.6, 2.8, -D / 2 + .17); scene.add(mullion);
  var sill = new T.Mesh(new T.BoxGeometry(2.6, .12, .45), M.trim); sill.position.set(-1.6, 1.42, -D / 2 + .2); scene.add(sill);
  var sunDisc = new T.Mesh(new T.CircleGeometry(.32, 32), new T.MeshBasicMaterial({ color: "#FBE3C8" })); sunDisc.position.set(-2.05, 3.35, -D / 2 + .16); scene.add(sunDisc);

  // Door on the left wall.
  var door = new T.Mesh(new T.ExtrudeGeometry(arch(1.5, 2.8), { depth: .1, bevelEnabled: false }), M.lilac);
  door.rotation.y = Math.PI / 2; door.position.set(-W / 2 + .02, 0, 2.2); scene.add(door);
  var knob = new T.Mesh(new T.SphereGeometry(.07, 16, 12), M.brass); knob.position.set(-W / 2 + .16, 1.25, 1.75); scene.add(knob);

  // The sign above the counter, painted on a canvas.
  function signTexture() {
    var c = document.createElement("canvas"); c.width = 512; c.height = 160; var g = c.getContext("2d");
    g.fillStyle = "#3A2731"; g.beginPath(); g.roundRect ? g.roundRect(0, 0, 512, 160, 30) : g.rect(0, 0, 512, 160); g.fill();
    g.fillStyle = "#F6D9A0"; g.font = "700 74px 'SF Arabic','Noto Sans Arabic',system-ui,sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.direction = "rtl"; g.fillText("قهوة ستّي", 256, 86);
    var t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; return t;
  }
  var sign = new T.Mesh(new T.PlaneGeometry(2.4, .75), new T.MeshBasicMaterial({ map: signTexture() }));
  sign.position.set(2.7, 3.55, -D / 2 + .05); scene.add(sign);

  // Counter with drawer fronts, a dallah and cups.
  var counter = new T.Group(); counter.position.set(2.7, 0, -2.9); scene.add(counter);
  var cBody = new T.Mesh(new T.BoxGeometry(3.6, 1.1, 1), M.counter); cBody.position.y = .55; cBody.castShadow = cBody.receiveShadow = true; counter.add(cBody);
  var cTop = new T.Mesh(new T.BoxGeometry(3.8, .1, 1.15), M.counterTop); cTop.position.y = 1.15; cTop.castShadow = true; counter.add(cTop);
  [-1.1, 0, 1.1].forEach(function (x) { var d = new T.Mesh(new T.BoxGeometry(.9, .45, .04), mat("#FAF1F0")); d.position.set(x, .6, .51); counter.add(d); var h = new T.Mesh(new T.BoxGeometry(.3, .05, .05), M.brass); h.position.set(x, .62, .55); counter.add(h); });
  function dallah(s) {
    var pts = [[0, 0], [.32, 0], [.36, .08], [.3, .45], [.18, .7], [.14, .78], [.2, .82], [.12, .9], [0, .95]].map(function (p) { return new T.Vector2(p[0] * s, p[1] * s); });
    var g = new T.Group();
    var body = new T.Mesh(new T.LatheGeometry(pts, 24), M.brass); body.castShadow = true; g.add(body);
    var spout = new T.Mesh(new T.CylinderGeometry(.03 * s, .06 * s, .5 * s, 10), M.brass); spout.position.set(.32 * s, .55 * s, 0); spout.rotation.z = -1; g.add(spout);
    return g;
  }
  var d1 = dallah(.55); d1.position.set(-1.2, 1.2, 0); counter.add(d1);
  [0, .35].forEach(function (x) { var cup = new T.Mesh(new T.CylinderGeometry(.1, .07, .14, 16), M.cup); cup.position.set(x, 1.27, .1); cup.castShadow = true; counter.add(cup); });

  // Shelf with dallahs on the back wall.
  var shelf = new T.Mesh(new T.BoxGeometry(2.6, .08, .4), M.woodDark); shelf.position.set(2.7, 2.6, -D / 2 + .22); shelf.castShadow = true; scene.add(shelf);
  [-.8, 0, .8].forEach(function (x, i) { var d = dallah(.42 + i * .04); d.position.set(2.7 + x, 2.64, -D / 2 + .25); scene.add(d); });

  /* ---------- Tables and seats ---------- */
  var SEATS = [];
  function table(x, z) {
    var g = new T.Group(); g.position.set(x, 0, z);
    var top = new T.Mesh(new T.CylinderGeometry(.6, .6, .07, 32), M.counter); top.position.y = .78; top.castShadow = top.receiveShadow = true; g.add(top);
    var leg = new T.Mesh(new T.CylinderGeometry(.06, .06, .76, 12), M.woodDark); leg.position.y = .39; leg.castShadow = true; g.add(leg);
    var foot = new T.Mesh(new T.CylinderGeometry(.3, .32, .04, 24), M.woodDark); foot.position.y = .02; g.add(foot);
    scene.add(g);
    [[-1, 0], [1, 0]].forEach(function (o) {
      var cx = x + o[0] * 1.05, cz = z + o[1];
      var ch = new T.Group(); ch.position.set(cx, 0, cz);
      var seat = new T.Mesh(new T.CylinderGeometry(.32, .32, .08, 24), M.wood); seat.position.y = .46; seat.castShadow = true; ch.add(seat);
      var l = new T.Mesh(new T.CylinderGeometry(.04, .04, .44, 8), M.woodDark); l.position.y = .22; ch.add(l);
      var back = new T.Mesh(new T.BoxGeometry(.06, .55, .5), M.wood); back.position.set(o[0] * .3, .78, 0); back.castShadow = true; ch.add(back);
      scene.add(ch);
      SEATS.push({ x: cx, z: cz, face: -o[0], taken: null, table: g });
    });
    return g;
  }
  table(-2.3, .3); table(.9, 1.9); table(-.7, -1.6);

  /* ---------- Lights ---------- */
  var hemi = new T.HemisphereLight("#FFF6F2", "#D9B9B4", .5); scene.add(hemi);
  var sun = new T.DirectionalLight("#FFE9D6", 1.1); sun.position.set(6, 9, 6); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024); sun.shadow.camera.left = -8; sun.shadow.camera.right = 8; sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8; sun.shadow.bias = -.0005; sun.shadow.radius = 4;
  scene.add(sun);
  var warm = new T.PointLight("#FFC98A", 0, 9, 2); warm.position.set(2.7, 3, -2.2); scene.add(warm);
  var lampLights = [];

  // String lights across the room.
  var bulbs = new T.Group(); scene.add(bulbs);
  var bulbMat = new T.MeshStandardMaterial({ color: "#FFF1D0", emissive: "#FFCF7A", emissiveIntensity: 0 });
  for (var i = 0; i < 11; i++) {
    var t = i / 10, bx = -W / 2 + .3 + t * (W - .6), by = 4.25 - Math.sin(t * Math.PI) * .45;
    var b = new T.Mesh(new T.SphereGeometry(.07, 12, 10), bulbMat); b.position.set(bx, by, -D / 2 + .5); bulbs.add(b);
  }

  /* ---------- Time of day ---------- */
  var TIMES = {
    morning: { bg: "#F3E4E4", sky: "#D7E4F2", sunC: "#FFE9D6", sunI: 1.1, sunPos: [6, 9, 6], hemi: .5, warm: 0, bulbs: 0, disc: "#FBE3C8", exp: .82 },
    evening: { bg: "#F1D9CF", sky: "#F6C7A6", sunC: "#FFC48E", sunI: .9, sunPos: [-7, 4.5, 5], hemi: .4, warm: .6, bulbs: .6, disc: "#F59E7A", exp: .85 },
    night: { bg: "#2B2540", sky: "#2E3560", sunC: "#9FB0E8", sunI: .18, sunPos: [-4, 8, 3], hemi: .2, warm: 2.2, bulbs: 2.2, disc: "#F3EBD0", exp: 1.0 }
  };
  var cur = JSON.parse(JSON.stringify(TIMES.morning)), from = null, to = null, tStart = 0;
  function setTime(k) {
    from = JSON.parse(JSON.stringify(cur)); to = TIMES[k]; tStart = performance.now();
    Array.prototype.forEach.call(document.querySelectorAll(".time button"), function (b) { b.setAttribute("aria-pressed", b.dataset.t === k ? "true" : "false"); });
    timeKey = k;
  }
  var timeKey = "morning";
  function lerpC(a, b, t) { return "#" + new T.Color(a).lerp(new T.Color(b), t).getHexString(); }
  function applyTime(now) {
    if (to) {
      var p = Math.min(1, (now - tStart) / 1200); var e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      ["bg", "sky", "sunC", "disc"].forEach(function (k) { cur[k] = lerpC(from[k], to[k], e); });
      ["sunI", "hemi", "warm", "bulbs", "exp"].forEach(function (k) { cur[k] = from[k] + (to[k] - from[k]) * e; });
      cur.sunPos = from.sunPos.map(function (v, i) { return v + (to.sunPos[i] - v) * e; });
      if (p >= 1) to = null;
    }
    scene.background.set(cur.bg); M.glass.color.set(cur.sky); sunDisc.material.color.set(cur.disc);
    sun.color.set(cur.sunC); sun.intensity = cur.sunI; sun.position.set(cur.sunPos[0], cur.sunPos[1], cur.sunPos[2]);
    hemi.intensity = cur.hemi; warm.intensity = cur.warm; bulbMat.emissiveIntensity = cur.bulbs;
    renderer.toneMappingExposure = cur.exp;
    lampLights.forEach(function (l) { l.intensity = cur.warm * .7; l.userData.shade.material.emissiveIntensity = cur.warm * .35; });
  }

  /* ---------- Decor ---------- */
  var STYLES = {
    old: { a: "#A57A62", b: "#E7B4BE", c: "#D9B06C", rug: ["#B8564F", "#E9C99B"] },
    modern: { a: "#F2F2F0", b: "#B9D1BE", c: "#C8697A", rug: ["#D8CDEB", "#FFFFFF"] },
    gulf: { a: "#7E2F43", b: "#E9C99B", c: "#D9B06C", rug: ["#7E2F43", "#E9C99B"] }
  };
  var style = "old";
  var DECOR = {
    plant: { n: "نبتة", cost: 20, cosy: 3, icon: '<svg viewBox="0 0 24 24"><path d="M12 14 C6 12 5 6 7 2 C11 5 13 9 12 14z" fill="#9DBFA6"/><path d="M12 14 C18 12 19 5 17 1 C13 5 11 9 12 14z" fill="#B9D1BE"/><path d="M7 14 h10 l-1.5 8 h-7z" fill="#E7B4BE"/></svg>' },
    lamp: { n: "لمبة", cost: 35, cosy: 4, icon: '<svg viewBox="0 0 24 24"><path d="M7 9 l2-6 h6 l2 6z" fill="#F6D9A0"/><path d="M12 9 v11" stroke="#A57A62" stroke-width="1.6"/><path d="M8 21 h8" stroke="#A57A62" stroke-width="2" stroke-linecap="round"/></svg>' },
    rug: { n: "سجادة", cost: 30, cosy: 5, icon: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" fill="#B8564F"/><rect x="6" y="9" width="12" height="6" rx="1" fill="#E9C99B"/></svg>' },
    stool: { n: "مقعد", cost: 25, cosy: 2, icon: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="7" ry="3" fill="#E7B4BE"/><path d="M7 10 l-1 10 M17 10 l1 10 M12 12 v8" stroke="#A57A62" stroke-width="1.6" stroke-linecap="round"/></svg>' },
    flowers: { n: "ورد", cost: 15, cosy: 2, icon: '<svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3" fill="#E9A0AE"/><circle cx="15" cy="6" r="3" fill="#D8CDEB"/><circle cx="12" cy="10" r="3" fill="#F6D9A0"/><path d="M8 14 h8 l-1 7 h-6z" fill="#B9D1BE"/></svg>' }
  };
  var placed = [], selected = null, ghost = null;

  function build(kind, st) {
    var s = STYLES[st], g = new T.Group();
    if (kind === "plant") {
      var p = new T.Mesh(new T.CylinderGeometry(.28, .2, .45, 20), mat(s.b)); p.position.y = .22; g.add(p);
      for (var k = 0; k < 7; k++) { var lf = new T.Mesh(new T.SphereGeometry(.22, 14, 10), k % 2 ? M.leaf : M.sage); lf.scale.set(.7, 1.4, .7); var a = k / 7 * Math.PI * 2; lf.position.set(Math.cos(a) * .18, .7 + (k % 3) * .12, Math.sin(a) * .18); lf.rotation.z = Math.cos(a) * .5; lf.rotation.x = Math.sin(a) * .5; g.add(lf); }
    } else if (kind === "lamp") {
      var pole = new T.Mesh(new T.CylinderGeometry(.03, .03, 1.6, 10), mat(s.a)); pole.position.y = .8; g.add(pole);
      var ft = new T.Mesh(new T.CylinderGeometry(.22, .25, .05, 20), mat(s.a)); ft.position.y = .025; g.add(ft);
      var shade = new T.Mesh(new T.CylinderGeometry(.18, .32, .36, 24, 1, true), new T.MeshStandardMaterial({ color: "#F6E4C4", emissive: "#FFC98A", emissiveIntensity: 0, side: T.DoubleSide, roughness: .9 })); shade.position.y = 1.62; g.add(shade);
      var l = new T.PointLight("#FFC98A", cur.warm * .7, 4.5, 2); l.position.y = 1.5; l.userData.shade = shade; g.add(l); lampLights.push(l);
      shade.material.emissiveIntensity = cur.warm * .35;
    } else if (kind === "rug") {
      var r1 = new T.Mesh(new T.BoxGeometry(1.8, .02, 1.2), mat(s.rug[0])); r1.position.y = .011; g.add(r1);
      var r2 = new T.Mesh(new T.BoxGeometry(1.3, .025, .7), mat(s.rug[1])); r2.position.y = .013; g.add(r2);
      var r3 = new T.Mesh(new T.BoxGeometry(.5, .03, .3), mat(s.rug[0])); r3.position.y = .015; g.add(r3);
    } else if (kind === "stool") {
      var sc = new T.Mesh(new T.CylinderGeometry(.3, .28, .18, 24), mat(s.b)); sc.position.y = .42; g.add(sc);
      [0, 1, 2].forEach(function (k) { var a = k / 3 * Math.PI * 2, lg = new T.Mesh(new T.CylinderGeometry(.03, .03, .36, 8), mat(s.a)); lg.position.set(Math.cos(a) * .18, .18, Math.sin(a) * .18); g.add(lg); });
    } else if (kind === "flowers") {
      var st2 = new T.Mesh(new T.CylinderGeometry(.22, .22, .5, 20), mat(s.a)); st2.position.y = .25; g.add(st2);
      var vase = new T.Mesh(new T.CylinderGeometry(.08, .1, .25, 16), mat("#FFFFFF", { roughness: .3 })); vase.position.y = .62; g.add(vase);
      ["#E9A0AE", "#D8CDEB", "#F6D9A0", "#E9A0AE", "#FFFFFF"].forEach(function (c, k) { var f = new T.Mesh(new T.SphereGeometry(.08, 12, 10), mat(c)); var a = k / 5 * Math.PI * 2; f.position.set(Math.cos(a) * .1, .85 + (k % 2) * .06, Math.sin(a) * .1); g.add(f); });
    }
    g.traverse(function (o) { if (o.isMesh) { o.castShadow = kind !== "rug"; o.receiveShadow = true; } });
    return g;
  }

  // Tray buttons.
  var itemsEl = $("items");
  Object.keys(DECOR).forEach(function (k) {
    var d = DECOR[k], b = document.createElement("button"); b.type = "button"; b.className = "item"; b.dataset.k = k; b.setAttribute("aria-pressed", "false");
    b.innerHTML = d.icon + "<span>" + d.n + "</span><small>" + d.cost + " عملة · +" + d.cosy + "</small>";
    b.addEventListener("click", function () { selectDecor(selected === k ? null : k); });
    itemsEl.appendChild(b);
  });
  function selectDecor(k) {
    selected = k;
    Array.prototype.forEach.call(itemsEl.children, function (b) { b.setAttribute("aria-pressed", b.dataset.k === k ? "true" : "false"); });
    if (ghost) { scene.remove(ghost); ghost = null; }
    if (k) {
      ghost = build(k, style); ghost.traverse(function (o) { if (o.isMesh) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = .55; o.castShadow = false; } if (o.isLight) { o.intensity = 0; lampLights.splice(lampLights.indexOf(o), 1); } });
      ghost.visible = false; scene.add(ghost);
      hint("دقّي على الأرض لتحطّي ال" + DECOR[k].n.replace(/^ال/, "") + ".");
    } else hint("اختاري قطعة، وبعدين دقّي على الأرض لتحطّيها. دقّي على الزبون لتقدّميله قهوة.");
  }
  Array.prototype.forEach.call(document.querySelectorAll(".styles button"), function (b) {
    b.addEventListener("click", function () {
      style = b.dataset.s;
      Array.prototype.forEach.call(document.querySelectorAll(".styles button"), function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      if (selected) selectDecor(selected);
      toast("ستايل " + b.textContent);
    });
  });

  var coins = 120, cosy = 0;
  function stats() { $("coins").textContent = coins; $("cosy").textContent = cosy; }
  function hint(t) { $("hint").textContent = t; }
  var tt; function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove("on"); }, 1400); }

  function blocked(x, z) {
    if (Math.abs(x) > W / 2 - .5 || Math.abs(z) > D / 2 - .5) return true;
    if (x > .7 && z < -2.1) return true; // counter
    if (x < -4.2 && Math.abs(z - 2.2) < 1) return true; // doorway
    for (var i = 0; i < SEATS.length; i += 2) { var tp = SEATS[i].table.position; if (Math.hypot(x - tp.x, z - tp.z) < 1.4) return true; }
    return placed.some(function (p) { return Math.hypot(p.x - x, p.z - z) < .7; });
  }
  function place(x, z) {
    var d = DECOR[selected];
    if (coins < d.cost) { toast("بدّك عملات أكتر. قدّمي قهوة للزبائن."); return; }
    if (blocked(x, z)) { toast("ما في مكان هون"); return; }
    var g = build(selected, style); g.position.set(x, 0, z); g.rotation.y = Math.round(Math.random() * 3) * Math.PI / 2; scene.add(g);
    g.scale.setScalar(.01); popIn.push({ g: g, t: performance.now() });
    placed.push({ x: x, z: z, k: selected, style: style });
    // Three or more pieces in one style earn a small set bonus.
    coins -= d.cost; cosy += d.cosy + (placed.filter(function (p) { return p.style === style; }).length >= 3 ? 1 : 0);
    stats(); toast("+" + d.cosy + " دفا");
    chime();
  }
  var popIn = [];

  /* ---------- People ---------- */
  var LOOKS = [
    { skin: "#E6BFA2", hair: "#D3CBC8", top: "#B9CDBF", stache: true, name: "أبو فادي" },
    { skin: "#EDC7AE", hijab: "#D8CDEB", top: "#7E2F43", name: "لانا" },
    { skin: "#E9C2A6", hair: "#4A3036", top: "#E7A9B4", name: "طالبة" },
    { skin: "#D9B091", hijab: "#B9D1BE", top: "#A57A62", name: "أم رامي" },
    { skin: "#E6BFA2", hair: "#2E2228", top: "#BFD3E6", name: "كريم" },
    { skin: "#EDC7AE", hijab: "#E7B4BE", top: "#D8CDEB", name: "د. هبة" }
  ];
  function person(look) {
    var g = new T.Group(), body = new T.Group(); g.add(body);
    var torso = new T.Mesh(new T.CapsuleGeometry(.27, .45, 6, 16), mat(look.top)); torso.position.y = .62; torso.castShadow = true; body.add(torso);
    var head = new T.Group(); head.position.y = 1.22; body.add(head);
    if (look.hijab) {
      var hj = new T.Mesh(new T.SphereGeometry(.3, 24, 18), mat(look.hijab)); hj.scale.set(1, 1.08, 1); hj.castShadow = true; head.add(hj);
      var drape = new T.Mesh(new T.CylinderGeometry(.24, .34, .32, 20), mat(look.hijab)); drape.position.y = -.22; head.add(drape);
      var face = new T.Mesh(new T.SphereGeometry(.22, 24, 18), mat(look.skin)); face.position.set(0, -.01, .12); head.add(face);
    } else {
      var hd = new T.Mesh(new T.SphereGeometry(.26, 24, 18), mat(look.skin)); hd.castShadow = true; head.add(hd);
      var hair = new T.Mesh(new T.SphereGeometry(.275, 24, 18, 0, Math.PI * 2, 0, Math.PI * .55), mat(look.hair)); hair.rotation.x = -.35; head.add(hair);
    }
    var eyeM = M.black, ez = look.hijab ? .33 : .24;
    [-.08, .08].forEach(function (x) { var e = new T.Mesh(new T.SphereGeometry(.028, 10, 8), eyeM); e.position.set(x, .02, ez); head.add(e); var ch = new T.Mesh(new T.SphereGeometry(.04, 10, 8), mat("#F2A7B3")); ch.position.set(x * 1.6, -.07, ez - .03); ch.scale.z = .4; head.add(ch); });
    if (look.stache) { var st = new T.Mesh(new T.CapsuleGeometry(.025, .1, 4, 8), mat("#C9C1BE")); st.rotation.z = Math.PI / 2; st.position.set(0, -.08, .25); head.add(st); }
    g.userData = { body: body, head: head };
    return g;
  }

  function bubbleSprite() {
    var c = document.createElement("canvas"); c.width = c.height = 128; var g = c.getContext("2d");
    g.fillStyle = "rgba(255,255,255,.95)"; g.beginPath(); g.arc(64, 56, 44, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.moveTo(54, 96); g.lineTo(64, 118); g.lineTo(74, 96); g.fill();
    g.fillStyle = "#FFFFFF"; g.strokeStyle = "#E2C3C8"; g.lineWidth = 4;
    g.beginPath(); g.moveTo(40, 44); g.lineTo(88, 44); g.lineTo(80, 76); g.lineTo(48, 76); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = "#C8697A"; g.lineWidth = 6; g.beginPath(); g.moveTo(42, 52); g.lineTo(86, 52); g.stroke();
    var t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding;
    var s = new T.Sprite(new T.SpriteMaterial({ map: t, depthTest: false })); s.scale.set(.7, .7, 1); s.renderOrder = 10; return s;
  }
  function heartSprite() {
    var c = document.createElement("canvas"); c.width = c.height = 64; var g = c.getContext("2d");
    g.fillStyle = "#E9A0AE"; g.beginPath(); g.moveTo(32, 56); g.bezierCurveTo(4, 36, 6, 10, 22, 10); g.bezierCurveTo(28, 10, 32, 16, 32, 20); g.bezierCurveTo(32, 16, 36, 10, 42, 10); g.bezierCurveTo(58, 10, 60, 36, 32, 56); g.fill();
    var t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding;
    var s = new T.Sprite(new T.SpriteMaterial({ map: t, depthTest: false, transparent: true })); s.scale.set(.32, .32, 1); s.renderOrder = 11; return s;
  }
  var hearts = [];

  var people = [];
  var DOOR = new T.Vector3(-W / 2 + .3, 0, 2.2), ENTRY = new T.Vector3(-3.6, 0, 2.2);
  function maxGuests() { return Math.min(SEATS.length, 2 + Math.floor(cosy / 8)); }
  function spawn() {
    var free = SEATS.filter(function (s) { return !s.taken; });
    if (!free.length || people.length >= maxGuests()) return;
    var seat = free[Math.floor(Math.random() * free.length)];
    var used = people.map(function (p) { return p.look; });
    var looks = LOOKS.filter(function (l) { return used.indexOf(l) < 0; }); if (!looks.length) looks = LOOKS;
    var look = looks[Math.floor(Math.random() * looks.length)];
    var p = { look: look, g: person(look), seat: seat, state: "in", path: [DOOR.clone(), ENTRY.clone(), new T.Vector3(seat.x + seat.face * .1, 0, seat.z + .9), new T.Vector3(seat.x, 0, seat.z)], seg: 0, t: 0, timer: 0 };
    seat.taken = p; p.g.position.copy(DOOR); scene.add(p.g); people.push(p);
    p.g.traverse(function (o) { if (o.isMesh) o.userData.person = p; });
  }
  function serve(p) {
    if (p.state !== "wait") return;
    p.state = "sip"; p.timer = 0; if (p.bubble) { p.g.remove(p.bubble); p.bubble = null; }
    var cup = new T.Mesh(new T.CylinderGeometry(.09, .06, .13, 16), M.cup); cup.castShadow = true;
    var tp = p.seat.table.position; cup.position.set(tp.x + (p.seat.x - tp.x) * .45, .88, tp.z); scene.add(cup); p.cup = cup;
    var tip = 6 + Math.round(cosy / 4); coins += tip; stats(); toast(p.look.name + ": يسلمو! +" + tip);
    for (var k = 0; k < 4; k++) { var h = heartSprite(); h.position.set(p.g.position.x + (Math.random() - .5) * .4, 1.7, p.g.position.z); scene.add(h); hearts.push({ s: h, t: performance.now() + k * 140, x0: h.position.x }); }
    chime();
  }

  function updatePeople(dt, now) {
    people.slice().forEach(function (p) {
      var u = p.g.userData;
      if (p.state === "in" || p.state === "out") {
        var a = p.path[p.seg], b = p.path[p.seg + 1];
        if (!b) {
          if (p.state === "in") { p.state = "wait"; p.timer = 0; p.g.rotation.y = p.seat.face > 0 ? Math.PI / 2 : -Math.PI / 2; u.body.position.y = -.18; p.bubble = bubbleSprite(); p.bubble.position.set(0, 2.05, 0); p.g.add(p.bubble); }
          else { scene.remove(p.g); people.splice(people.indexOf(p), 1); }
          return;
        }
        var len = a.distanceTo(b); p.t += dt * 1.25 / Math.max(len, .01);
        if (p.t >= 1) { p.t = 0; p.seg++; return; }
        p.g.position.lerpVectors(a, b, p.t);
        p.g.rotation.y = Math.atan2(b.x - a.x, b.z - a.z);
        u.body.position.y = Math.abs(Math.sin(now / 130)) * .06; u.body.rotation.z = Math.sin(now / 260) * .05;
      } else if (p.state === "wait") {
        p.timer += dt; u.head.rotation.y = Math.sin(now / 900 + p.seat.x) * .25;
        if (p.bubble) p.bubble.position.y = 2.05 + Math.sin(now / 300) * .04;
        if (p.timer > 40) leave(p);
      } else if (p.state === "sip") {
        p.timer += dt; u.head.rotation.x = p.timer % 3 < .8 ? -.25 : 0; u.body.rotation.z = Math.sin(now / 700) * .03;
        if (p.timer > 9) leave(p);
      }
      if (p.state !== "in" && p.state !== "out") u.body.scale.y = 1 + Math.sin(now / 600 + p.seat.z) * .012; // breathing
    });
  }
  function leave(p) {
    if (p.bubble) { p.g.remove(p.bubble); p.bubble = null; }
    if (p.cup) { scene.remove(p.cup); p.cup = null; }
    p.g.userData.body.position.y = 0; p.g.userData.head.rotation.set(0, 0, 0);
    p.state = "out"; p.seg = 0; p.t = 0; p.seat.taken = null;
    p.path = [p.g.position.clone(), new T.Vector3(p.seat.x + p.seat.face * .1, 0, p.seat.z + .9), ENTRY.clone(), DOOR.clone()];
  }

  /* ---------- Sound ---------- */
  var ac = null;
  function chime() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      [1318.5, 1975.5].forEach(function (f, i) { var t = ac.currentTime + i * .08, o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.06, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + 1); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 1.1); });
      if (navigator.vibrate) navigator.vibrate(10);
    } catch (e) {}
  }

  /* ---------- Input: orbit, pinch, tap ---------- */
  var ray = new T.Raycaster(), ndc = new T.Vector2(), plane = new T.Plane(new T.Vector3(0, 1, 0), 0);
  var ptrs = {}, down = null, pinch0 = 0, r0 = 0;
  function toNdc(e) { var r = renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, camera); }
  function floorPoint(e) { toNdc(e); var p = new T.Vector3(); if (!ray.ray.intersectPlane(plane, p)) return null; p.x = Math.round(p.x * 2) / 2; p.z = Math.round(p.z * 2) / 2; return p; }
  renderer.domElement.addEventListener("pointerdown", function (e) {
    renderer.domElement.setPointerCapture(e.pointerId);
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(ptrs);
    if (ids.length === 1) down = { x: e.clientX, y: e.clientY, moved: false };
    if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); r0 = orbit.radius; down = null; }
  });
  renderer.domElement.addEventListener("pointermove", function (e) {
    if (ghost && !ptrs[e.pointerId]) { var p = floorPoint(e); if (p) { ghost.visible = true; ghost.position.set(p.x, 0, p.z); } }
    if (!ptrs[e.pointerId]) return;
    var prev = ptrs[e.pointerId]; var dx = e.clientX - prev.x, dy = e.clientY - prev.y; ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(ptrs);
    if (ids.length === 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]]; var d = Math.hypot(a.x - b.x, a.y - b.y); touched = true; orbit.radius = Math.max(9, Math.min(28, r0 * pinch0 / Math.max(d, 1))); return; }
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) down.moved = true;
    if (down && down.moved) { touched = true; orbit.theta = Math.max(-.15, Math.min(1.45, orbit.theta - dx * .006)); orbit.phi = Math.max(.55, Math.min(1.3, orbit.phi - dy * .005)); }
    if (ghost) { var gp = floorPoint(e); if (gp) { ghost.visible = true; ghost.position.set(gp.x, 0, gp.z); } }
  });
  function up(e) {
    delete ptrs[e.pointerId];
    if (down && !down.moved) tap(e);
    down = null;
  }
  renderer.domElement.addEventListener("pointerup", up);
  renderer.domElement.addEventListener("pointercancel", function (e) { delete ptrs[e.pointerId]; down = null; });
  renderer.domElement.addEventListener("wheel", function (e) { e.preventDefault(); touched = true; orbit.radius = Math.max(9, Math.min(28, orbit.radius + e.deltaY * .01)); }, { passive: false });
  function tap(e) {
    toNdc(e);
    var hits = ray.intersectObjects(people.map(function (p) { return p.g; }), true);
    if (hits.length) { var p = hits[0].object.userData.person; if (p) { if (p.state === "wait") serve(p); else if (p.state === "sip") toast(p.look.name + " عم تشرب قهوتها"); return; } }
    if (selected) { var fp = floorPoint(e); if (fp) place(fp.x, fp.z); }
  }
  $("reset").addEventListener("click", function () { orbit.theta = HOME.theta; orbit.phi = HOME.phi; orbit.radius = HOME.radius; });
  Array.prototype.forEach.call(document.querySelectorAll(".time button"), function (b) { b.addEventListener("click", function () { setTime(b.dataset.t); }); });

  /* ---------- Loop ---------- */
  var last = performance.now(), spawnT = 0;
  function frame(now) {
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    spawnT += dt; if (spawnT > 3.5) { spawnT = 0; spawn(); }
    updatePeople(dt, now);
    applyTime(now);
    popIn = popIn.filter(function (o) { var p = Math.min(1, (now - o.t) / 450); var s = 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2); o.g.scale.setScalar(Math.max(.01, s)); return p < 1; });
    hearts = hearts.filter(function (h) { var p = (now - h.t) / 1600; if (p < 0) { h.s.visible = false; return true; } h.s.visible = true; h.s.position.y = 1.7 + p * 1.1; h.s.position.x = h.x0 + Math.sin(p * 6) * .12; h.s.material.opacity = 1 - p; if (p >= 1) { scene.remove(h.s); return false; } return true; });
    placeCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  window.addEventListener("resize", resize);
  resize(); stats(); spawn(); spawn();
  requestAnimationFrame(frame);
})();
</script>
